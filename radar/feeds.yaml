# Automated Signal Ingestion Pipeline — Feed Registry
#
# Governance (Harness Wall):
# - This file on `main` is strictly human-edited. Automation NEVER mutates it.
# - Every source is scrape-free (RSS/Atom, GitHub Releases Atom, or public JSON API).
# - Quarterly pruning removes sources with 0 human-merged items in 90d, >90% rejection,
#   or >=3 consecutive fetch errors. Unsubscribed sources with >=2 merged or
#   Stage 3-approved items in 90d are surfaced in the health report as manual promotion candidates.

version: 1

# Deterministic keyword allowlist used for noisy feeds (e.g., patch releases, HN, broad blogs)
default_agentic_keywords:
  - agent
  - agentic
  - harness
  - mcp
  - model context protocol
  - skill
  - skills.md
  - agents.md
  - claude code
  - copilot cli
  - codex
  - antigravity
  - code mode
  - programmatic tool
  - verification
  - verifier
  - eval
  - evals
  - sandbox
  - prompt cache
  - reasoning effort
  - thinking level
  - subagent
  - hook
  - hooks
  - worktree
  - review.md
  - diff-triggered
  - managed agents
  - karpathy

feeds:
  - id: anthropic-engineering
    name: Anthropic Engineering Blog (Community RSS Mirror)
    type: rss
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml
    source_domains:
      - anthropic.com
    category: vendor
    max_items: 10
    notes: Anthropic has no official RSS feed; hourly community XML mirror treated as untrusted input.

  - id: claude-code-releases
    name: Claude Code GitHub Releases
    type: github_releases
    url: https://github.com/anthropics/claude-code/releases.atom
    changelog_fallback_url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
    category: vendor-release
    max_items: 10
    filter_patch_releases: true
    filter_prereleases: true
    keywords:
      - code mode
      - hook
      - hooks
      - mcp
      - skill
      - skills
      - sandbox
      - permission
      - subagent
      - agent team
      - worktree
      - verify
      - review
      - effort
      - thinking
      - background

  - id: github-copilot-changelog
    name: GitHub Changelog — Copilot
    type: rss
    url: https://github.blog/changelog/label/copilot/feed/
    category: vendor
    max_items: 10
    keywords:
      - cli
      - agent
      - mcp
      - hook
      - skill
      - custom agent
      - instructions
      - review
      - worktree
      - sandbox
      - coding agent

  - id: openai-news
    name: OpenAI News & Engineering
    type: rss
    url: https://openai.com/news/rss.xml
    category: vendor
    max_items: 10
    use_default_keywords: true

  - id: openai-codex-releases
    name: OpenAI Codex CLI Releases
    type: github_releases
    url: https://github.com/openai/codex/releases.atom
    category: vendor-release
    max_items: 10
    filter_patch_releases: true
    filter_prereleases: true
    keywords:
      - mcp
      - skill
      - hook
      - sandbox
      - approval
      - exec
      - agent
      - subagent
      - effort
      - reasoning
      - review
      - worktree

  - id: google-deepmind-blog
    name: Google DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    category: vendor
    max_items: 10
    use_default_keywords: true

  - id: karpathy-bearblog
    name: Andrej Karpathy — Bear Blog
    type: rss
    url: https://karpathy.bearblog.dev/feed/
    category: practitioner
    max_items: 10
    notes: Active low-volume blog with full-content RSS; no keyword gate so all posts enter Stage 1.

  - id: karpathy-blog
    name: Andrej Karpathy — Long-Form Technical Blog
    type: rss
    url: https://karpathy.github.io/feed.xml
    category: practitioner
    max_items: 10
    notes: Long-form technical essays (e.g., microgpt); low-volume RSS 2.0, no keyword gate needed.

  - id: simon-willison
    name: Simon Willison Weblog & Linklog
    type: rss
    url: https://simonwillison.net/atom/everything/
    category: curator
    max_items: 15
    use_default_keywords: true

  - id: addy-osmani-elevate
    name: Addy Osmani — Agentic Engineering Blog
    type: rss
    url: https://addyosmani.com/rss.xml
    source_domains:
      - addyo.substack.com
    category: practitioner
    max_items: 10
    use_default_keywords: true
    notes: Native static RSS feed (avoids Substack Cloudflare 403 blocks on GitHub Actions IPs).

  - id: hn-agentic
    name: Hacker News (High-Score Agentic Stories)
    type: hn_algolia
    url: https://hn.algolia.com/api/v1/search_by_date?tags=story&numericFilters=points%3E%3D100&hitsPerPage=30
    category: aggregator
    max_items: 15
    min_points: 100
    use_default_keywords: true
