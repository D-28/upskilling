[project]
name = "upskilling-radar"
version = "0.1.0"
description = "Automated, repo-aware signal ingestion pipeline for agentic engineering upskilling."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.0.0,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
